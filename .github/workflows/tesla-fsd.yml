name: Tesla FSD Mileage Tracker

on:
  schedule:
    # Beijing time: 00:17, 00:47, and 01:17.
    # The source is a server-published baseline, so sampling does not depend
    # on global driving activity. Later runs act as retries.
    - cron: "17,47 16 * * *"
    - cron: "17 17 * * *"
    # Beijing time 03:07 health check, after the final retry window.
    - cron: "7 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Replace today's Tesla FSD snapshot
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tesla-fsd-mileage-tracker
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule != '7 19 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Check whether collection is needed
        id: freshness
        shell: bash
        env:
          FORCE_RUN: ${{ inputs.force || false }}
        run: |
          expected_date=$(date +%F)
          latest_date=""
          if [ -f tesla_fsd.csv ]; then
            latest_date=$(tail -n 1 tesla_fsd.csv | cut -d, -f1 | tr -d '\r')
          fi

          echo "Expected date: ${expected_date}"
          echo "Latest Tesla stored date: ${latest_date:-<none>}"

          if [ "${FORCE_RUN}" = "true" ]; then
            echo "Manual force run requested"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "${latest_date}" = "${expected_date}" ]; then
            echo "Target date already exists; no work is needed"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "${latest_date}" && "${latest_date}" > "${expected_date}" ]]; then
            echo "::error::Stored date ${latest_date} is later than expected date ${expected_date}."
            exit 1
          else
            echo "Target date is missing; collection is needed"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.freshness.outputs.should_run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.freshness.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Test processing
        if: steps.freshness.outputs.should_run == 'true'
        run: python -m unittest -v test_reliability.py

      - name: Scrape server-published FSD baseline with retries
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Tesla FSD scrape attempt ${attempt}/3"
            if python scrape_tesla.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Scrape failed; waiting 15 minutes before retry"
              sleep 900
            fi
          done
          echo "Tesla FSD scrape failed after 3 attempts"
          exit 1

      - name: Commit and push data
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add tesla_fsd.csv tesla_fsd_daily.json tesla_fsd_monthly.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "update Tesla FSD mileage data"
          git pull --rebase origin main
          git push origin HEAD:main

  health-check:
    if: github.event_name == 'schedule' && github.event.schedule == '7 19 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - name: Verify today's Tesla FSD snapshot
        shell: bash
        run: |
          expected_date=$(date +%F)
          latest_date=""
          if [ -f tesla_fsd.csv ]; then
            latest_date=$(tail -n 1 tesla_fsd.csv | cut -d, -f1 | tr -d '\r')
          fi
          if [ "${latest_date}" != "${expected_date}" ]; then
            echo "::error::Tesla FSD data is stale. Expected ${expected_date}, found ${latest_date:-<none>}."
            exit 1
          fi
          echo "Tesla FSD data is current"
